# Pack map: OoT Reloaded (Ship of Harkinian .o2r). Classifies archive entries by path; the first
# matching rule wins. See PLAN.md "Source notes: OoT Reloaded".
name = "oot-reloaded"
# Anything unrecognized is left untouched.
default_category = "skip"
# Signs and lettering: no value grouping and no large-scale abstraction, so letters, symbols and
# thin painted borders stay legible.
no_grouping = ["alt/**/*Sign*", "alt/**/*Lettering*", "alt/**/*Text*"]
no_abstraction = ["alt/**/*Sign*", "alt/**/*Lettering*", "alt/**/*Text*"]

# Eyes and mouths are swapped per frame by the engine: never restyle them.
[[rules]]
glob = "alt/objects/**/*Eyes*"
category = "skip"

[[rules]]
glob = "alt/objects/**/*Mouth*"
category = "skip"

# Effects (glows, flames, sparks, puffs, lightning, splashes, shadow blobs): their gray is light
# intensity and falloff, often drawn additively, not paint. Left untouched (soft gray radial glows
# the names miss are detected too).
[[rules]]
glob = "alt/objects/**/*Eff*"
category = "effect"

[[rules]]
glob = "alt/objects/**/*Flame*"
category = "effect"

[[rules]]
glob = "alt/objects/**/*Spark*"
category = "effect"

[[rules]]
glob = "alt/objects/**/*Glow*"
category = "effect"

[[rules]]
glob = "alt/objects/**/*Flash*"
category = "effect"

[[rules]]
glob = "alt/objects/**/*Hilite*"
category = "effect"

[[rules]]
glob = "alt/objects/**/*LensFlare*"
category = "effect"

[[rules]]
glob = "alt/objects/**/*Lightning*"
category = "effect"

[[rules]]
glob = "alt/objects/**/*Shockwave*"
category = "effect"

[[rules]]
glob = "alt/objects/gameplay_keep/gDust*"
category = "effect"

[[rules]]
glob = "alt/objects/**/*Shadow*Tex"
category = "effect"

# Actors the cel shader does not relight render like world geometry.
[[rules]]
glob = "alt/objects/object_wood02/**"
category = "world"

[[rules]]
glob = "alt/objects/object_spot*/**"
category = "world"

[[rules]]
glob = "alt/objects/gameplay_field_keep/gFieldDoor*"
category = "world"

[[rules]]
glob = "alt/objects/object_bdoor/**"
category = "world"

[[rules]]
glob = "alt/objects/object_door_gerudo/**"
category = "world"

[[rules]]
glob = "alt/objects/object_haka_door/**"
category = "world"

[[rules]]
glob = "alt/objects/object_jya_door/**"
category = "world"

[[rules]]
glob = "alt/objects/**"
category = "actor"

# Pre-rendered scene images: room backdrops (market, Temple of Time exterior, houses, shops)...
[[rules]]
glob = "alt/scenes/**/*Background_*"
category = "background"

[[rules]]
glob = "alt/scenes/**"
category = "world"

# ...and the vr_*VR / vr_SP1a panoramas, which are shops, houses and the market, not skies.
[[rules]]
glob = "alt/textures/vr_*VR_static/**"
category = "background"

[[rules]]
glob = "alt/textures/vr_SP1a_static/**"
category = "background"

# Real skies: vr_fine*, vr_cloud*, vr_holy*.
[[rules]]
glob = "alt/textures/vr_*/**"
category = "skybox"

# HUD, icons, fonts, title cards and maps: copied through for now.
[[rules]]
glob = "alt/textures/**"
category = "ui"

# Moods: dark, haunting areas get the style's nocturne mood (first match wins). The Deku Tree is
# eerie but a first dungeon: a milder nocturne. The graveyard exterior stays base (its night is
# in-game lighting).
#
# Casts (the moonlight hue; suggested starts, the user picks later): the Shadow Temple, Bottom of
# the Well and the graves midnight purple; the Deku Tree and Forest Temple blue-teal; Ganon's
# Castle, the ruined market and the adult Temple of Time indigo (the style's default).
[[moods]]
glob = "alt/scenes/*/ydan_scene/**"
mood = "nocturne"
strength = 0.6
cast = "blue-teal"

[[moods]]
glob = "alt/scenes/shared/ydan_boss_scene/**"
mood = "nocturne"
strength = 0.6
cast = "blue-teal"

[[moods]]
glob = "alt/scenes/*/Bmori1_scene/**"
mood = "nocturne"
cast = "blue-teal"

[[moods]]
glob = "alt/scenes/*/HAKAdan_scene/**"
mood = "nocturne"
cast = "midnight-purple"

[[moods]]
glob = "alt/scenes/shared/HAKAdan_bs_scene/**"
mood = "nocturne"
cast = "midnight-purple"

[[moods]]
glob = "alt/scenes/*/HAKAdanCH_scene/**"
mood = "nocturne"
cast = "midnight-purple"

[[moods]]
glob = "alt/scenes/*/ganontika_scene/**"
mood = "nocturne"
cast = "indigo"

[[moods]]
glob = "alt/scenes/shared/ganontikasonogo_scene/**"
mood = "nocturne"
cast = "indigo"

[[moods]]
glob = "alt/scenes/shared/ganon_*scene/**"
mood = "nocturne"
cast = "indigo"

[[moods]]
glob = "alt/scenes/shared/hakaana*_scene/**"
mood = "nocturne"
cast = "midnight-purple"

[[moods]]
glob = "alt/scenes/shared/hakasitarelay_scene/**"
mood = "nocturne"
cast = "midnight-purple"

# Ruined adult Castle Town and the adult Temple of Time exterior: pre-rendered backgrounds
# (category background, rules above). The child versions (shrine_scene, shrine_n_scene) stay base.
[[moods]]
glob = "alt/textures/vr_RUVR_static/**"
mood = "nocturne"
cast = "indigo"

[[moods]]
glob = "alt/scenes/shared/shrine_r_scene/*Background_*"
mood = "nocturne"
cast = "indigo"

# Props (chests, pots, crates): visibly more brushwork than faces and skin, which keep the
# actor default. The wood grain, metal bands and lock shapes stay (the actor rules still apply).
[[brushwork]]
glob = "alt/objects/object_box/**"
strength = 2.5

[[brushwork]]
glob = "alt/objects/object_tsubo/**"
strength = 2.5

[[brushwork]]
glob = "alt/objects/object_kibako*/**"
strength = 2.5
