# PastelPlash style contract: the hard limits every style in `styles/` (in every mood it defines)
# and every target in `targets/` must stay within. The rule tests (tests/rules_*.rs) read these
# bounds; they never hard-code values. Bounds are wide enough for every shipped style (the
# watercolor base, impressionist, ss-baseline) and no wider.
#
# Tuning a style inside these bounds needs no test changes. Changing a bound here changes what
# PastelPlash's style *is*: do it deliberately, in its own reviewed commit. See docs/RULES.md.

# Numeric slack for checks on rendered output (OKLab units).
[tolerance]
lightness = 0.015
chroma = 0.012
# Fraction of texels allowed to miss a per-texel check (GPU float and LUT interpolation noise).
outliers = 0.002

[palette]
min_strength = 0.0
max_strength = 2.0
max_floor_margin = 0.08
# No crushed black: nothing (except accent darks) maps darker than this.
min_l = 0.15
# Darks are colored: any output darker than dark_l carries at least dark_min_chroma
# (never neutral near-black). Tint-safe textures (lightness only) are exempt, and so are the
# colored_darks_exempt categories: actors, whose shading the cel shader supplies (their
# near-neutral darks, steel and iron, keep their own faint hue instead of an umber floor).
dark_l = 0.3
dark_min_chroma = 0.015
colored_darks_exempt = ["actor"]
# No brown mud: an output darker than mud_l with a hue in mud_hue must not be dull
# (chroma between neutral and mud_max_chroma).
mud_l = 0.4
mud_hue = [40.0, 100.0]
mud_max_chroma = 0.035
# Actors keep their own painted colors, so for them the rule is relative: they introduce no mud. An
# actor output may sit in the mud band only if its source was already in it (the band widened by
# mud_relative_margin in chroma and lightness, and by mud_relative_hue degrees) or the output is
# the source's own color (chroma within mud_relative_max_dc, hue within mud_relative_max_dh): dull
# leather stays dull leather, Link's green or skin never turns to mud.
mud_relative = ["actor"]
mud_relative_margin = 0.01
mud_relative_hue = 10.0
mud_relative_max_dc = 0.01
mud_relative_max_dh = 15.0
# Pastel is not gray: a clearly colored source (chroma ≥ retention_min_source_chroma) keeps at
# least min(retention_ratio × its chroma, retention_floor).
retention_min_source_chroma = 0.05
retention_ratio = 0.6
retention_floor = 0.05
# Hue nudges stay nudges: colored texels move by at most this many degrees of hue.
max_hue_shift = 45.0
# Lifted darks keep their source hue family: a dark (L < 0.35), clearly colored source moves by
# at most this many degrees (dark brown stays brown, dark green stays green; nothing turns blue).
dark_max_hue_shift = 40.0

[accents]
max_fraction = 0.08
# Accents are cool colored shadows: blue to violet, never green, brown or black.
hue = [235.0, 300.0]
min_l = 0.28
max_chroma = 0.12

[vivid]
max_amount = 0.8
# Rendered chroma ceiling (rich styles keep the source's chroma; this only bounds excess).
max_chroma = 0.3

[technique]
# Single blown-white texels on a gritty, textured surface blend in: at most this much lighter
# (OKLab L) than the painted surface around them (glitter on the light treehouse bark; the rest
# is the tone curve on a mix of light and dark grains, not a fleck).
glitter_max_contrast = 0.09
max_kuwahara_radius = 32.0
max_edge_darkening = 0.10
max_granulation = 0.05
max_paper_grain = 0.03
max_paper_tint = 0.5
max_stroke_strength = 0.06
max_smear = 0.8
max_temperature_chroma = 0.05
# Rendered "no blur" check: a hard step edge stays within this many texels (10%–90% width).
max_edge_width = 4.0
# Value compression (rendered): fine-scale L std must drop by at least this fraction of the
# style's `value_contrast.fine` (Kuwahara and compression together), with the texture's mean L
# kept within value_mean_tolerance.
value_min_effect = 0.5
value_mean_tolerance = 0.06
# Adaptive compression: a high-contrast (trunk-like) texture's mid-scale L std drops by at least
# this fraction when the style enables `value_contrast.adaptive`; textures below the style's
# target spread are not affected by adaptivity at all.
adaptive_min_effect = 0.2
# Small salient objects (thin sticks, small bright shapes) on a busy wall keep at least this
# share of their contrast against their surroundings.
small_object_min_contrast = 0.5
# Legibility: small lettering on a busy (grouped, abstracted) sign keeps at least this share of
# its contrast against the board around it.
text_min_contrast = 0.6
# No "negative": within one material the dark and light masses stay one color family and value
# stays the main carrier. Split at the source's (smoothed) median lightness, the hue difference
# between the light half's and the dark half's mean colors changes by at most split_max_hue_change
# degrees (no warm-light / cool-dark temperature split), and the light-minus-dark lightness keeps
# at least split_min_separation of the source's.
split_max_hue_change = 25.0
split_min_separation = 0.6
# Specks: dark dots of a few texels on a busy surface are noise; they keep at most
# speck_max_contrast of their contrast against their surroundings (thin sticks, handles and
# lettering keep theirs: small_object_min_contrast, text_min_contrast).
speck_max_contrast = 0.5
# Thin cracks on engine-tinted (gray, vertex-colored) ground stay soft painted cracks: their darkest
# texels (p2 of L) darken by at most ink_max_darkening (no near-black ink lines).
ink_max_darkening = 0.12
# Thin, elongated objects (tool handles, poles, rails: 3 texels wide) on a busy wall: a shaft that
# differs by its color (a reddish handle as light as the wall) keeps at least thin_min_contrast of
# its color contrast; lighter or darker shafts keep at least thin_min_value_contrast of their
# lightness contrast (the tone mapping compresses all value contrast on purpose).
thin_min_contrast = 0.8
thin_min_value_contrast = 0.6

# Identity: it must still look and feel like the source game. Each texture's alpha-weighted mean
# OKLab color stays within max_mean_delta_e of the source's (for relit actors, of the source
# with its lightness held to the target's ceiling), and each hue group's mean hue moves by at
# most max_group_hue_shift. Styles that deliberately move further (opt-in looks) get their own,
# larger bound here.
[identity]
max_mean_delta_e = 0.08
max_group_hue_shift = 20.0
# Coarse identity ("from across the room"): on a 16×16 grid, each cell's dark-half and
# light-half mean colors (split at the cell's median L) are compared with the source's. Chroma
# change (OKLab a/b distance, 90th percentile over cells) is bounded tightly: it catches hue
# transformations such as dark grooves turned navy, which a mean color hides. Lightness change is
# bounded loosely (lifted darks and value compression are intended). Brushwork moves texels
# within a cell and does not register at this scale.
coarse_max_color = 0.06
coarse_max_lightness = 0.2
# Coarse lightness PATTERN (16x16 cell means): large light/dark patches (lichen, sunlit areas)
# must survive — correlation with the source grid, and the share of its p10..p90 range kept.
coarse_min_pattern_corr = 0.9
coarse_min_pattern_range = 0.45
# Hue families survive: on a two-material texture (green moss over brown wood), each family's
# share of the texels (by output hue) changes by at most family_share_max_change, and the mean
# hue difference between the two keeps at least family_min_separation of the source's.
family_share_max_change = 0.1
family_min_separation = 0.7
# Olive moss is not warmed into brown: a moss texture (hues in moss_hue) moves toward the warm
# earth hues by at most moss_max_warm_shift degrees on average (earth warmth targets earth).
moss_hue = [96.0, 120.0]
moss_max_warm_shift = 6.0
# No new hue (world): an output texel colored at least new_hue_min_chroma stays within
# new_hue_max_gap degrees of the hue of some texel of its 5x5 source neighborhood that is colored
# at least half that (no navy flecks on warm bark, no blue on olive moss). The only exception is a
# mood's moonlight cast: within new_hue_max_gap of the cast hue, up to moods.<name>.cast_max_chroma.
new_hue_min_chroma = 0.02
new_hue_max_gap = 60.0

# Pre-rendered backgrounds (finished paintings with the designers' lighting): the room's exposure
# stays — alpha-weighted mean L within background_max_mean_l of the source — and its coarse
# lightness pattern keeps at least background_min_pattern_range of its range, while crushed darks
# are still lifted into readable shadow.
background_max_mean_l = 0.03
background_min_pattern_range = 0.45   # the synthetic room has large crushed corners; Link's house keeps 0.77-0.88

[identity.styles]
ss-baseline = 0.15
ss-impressionist = 0.15   # ss-baseline's palette with impressionist brushwork

[identity.coarse_lightness_styles]
ss-baseline = 0.25
ss-impressionist = 0.25

# Applies to every file in targets/.
[target]
# Relit (actor) textures: the renderer multiplies by a lit factor that can exceed 1.
max_actor_ceiling = 0.9
# The cel shader decides lit/shadow at runtime: no baked temperature or shadow tint on actors.
max_actor_warm_cool = 0.0
max_actor_shadow_tint = 0.0
max_actor_cast = 0.0
# No baked cool accent darks on actors (blue flecks at a gold stud's highlight).
max_actor_accent = 0.0
# Actors keep their painted form and their own colors.
max_actor_delight = 0.4
max_actor_lift = 0.5
max_actor_hue = 0.5
# Pre-rendered backgrounds (finished paintings) get the gentlest treatment: no value grouping,
# accents or warm/cool split (one color family), and the palette's hue pulls, earth warmth,
# chroma floor and dark chroma held back to at most max_background_palette.
max_background_grouping = 0.0
max_background_accent = 0.0
max_background_warm_cool = 0.0
max_background_palette = 0.35

# Rendered actor preservation: colored actor texels keep their color and value.
[actor]
retention_ratio = 0.7
max_lightness_shift = 0.2
# Actor brushwork makes no large light/dark patches (the cel shader bands lit and shadow): the
# 16x16 cell-mean lightness change, less the texture's mean change, stays within max_patch_l (p95).
max_patch_l = 0.04
# The pack map may scale a file's brushwork (faces and skin lighter) by at most max_brushwork on
# top of its category's; actors still make no large patches there.
max_brushwork = 1.5
# Solid actors read painted: their brushwork on a smooth surface is at least min_mark_energy times
# the world's (world textures read painted mostly through their abstracted photographic detail,
# which smooth models lack; strokes carry it on actors).
min_mark_energy = 1.4
# No new hue: a colored actor texel stays within max_local_hue_change degrees of its 9x9 source
# neighborhood's mean hue (where that neighborhood is clearly colored).
max_local_hue_change = 45.0
# Near-neutral cool actor darks (steel, iron: hue in cool_dark_hue, faint chroma) keep their hue
# family: a colored output (C >= 0.012) stays in cool_dark_family (blue-gray to violet: no brown,
# no teal or green) or within max_cool_dark_hue_shift degrees of its source.
cool_dark_hue = [180.0, 260.0]
cool_dark_family = [185.0, 300.0]
max_cool_dark_hue_shift = 40.0
# Engine-tinted (tint-safe) actor textures may be raised to a median gray of at most
# max_tint_safe_gray and never above max_tint_safe_l (the tint provides the headroom, so they may
# exceed the actor ceiling); their folds stay (16x16 cell correlation with the source at least
# tint_safe_min_structure); strokes at most max_tint_safe_strokes.
max_tint_safe_gray = 0.92
max_tint_safe_l = 0.96
tint_safe_min_structure = 0.8
max_tint_safe_strokes = 0.1

# Per-mood allowances. Only in nocturne may lifted darks lean cool (indigo, violet, deep teal):
# their hue may rotate further, but they stay colored (the dark/mud/identity rules still apply).
[moods.nocturne]
dark_max_hue_shift = 60.0
max_cool_bias = 0.3
# Only moods listed with min_exposure may have a moonlight cast (palette.cast); at full mood
# strength it may dim the area down to this exposure (lightness above the palette floor scaled by
# it). The other rendered rules judge such a mood against the source dimmed the same way: the
# mood's declared exposure is its intended look.
min_exposure = 0.6
# Near-black, near-neutral sources (L < near_black_l, C < near_neutral_c) take at most a muted
# midnight: lifted at most near_black_max_lift above max(source L, palette.min_l), and, unless
# held at the no-mud chroma as a warm dark (hue in palette.mud_hue), chroma at most
# dark_chroma_per_l × L — never "ink".
near_black_l = 0.25
near_neutral_c = 0.012
near_black_max_lift = 0.06
dark_chroma_per_l = 0.12
# Near-black sources of any color (L < black_l) just go darker: unless held at the no-mud chroma as
# a warm dark (hue in the style's cast warm band, see black_warm_slack, or in palette.mud_hue),
# their chroma is at most black_max_chroma and they move toward the cast hue (OKLab a/b along it)
# by at most black_max_cast. Midnight tints the mid-darks, never the fade into black (the Deku
# Tree's hole went teal-blue into the dark).
black_l = 0.15
black_max_chroma = 0.02
black_max_cast = 0.01
# Warm darks held at the no-mud chroma: hues in the style's cast warm band, widened by this many
# degrees (the band's feather).
black_warm_slack = 6.0
# The near-black handling may fade chroma only below this source lightness: there darks need not
# carry palette.dark_min_chroma (they just go darker); above it, colored sources keep their color
# (palette.retention_*, "pastel is not gray") and darks are colored in this mood too.
black_fade_l = 0.25
# The cast's small chroma budget where it brings its own hue (identity.new_hue_*): a muted
# midnight, not blue paint.
cast_max_chroma = 0.04
# Dark rooms are no camouflage: tiling, speckled textures (dungeon floors) get paint marks at
# most this many times the regular size (at any mood strength). The day's larger ground dabs
# (3x, Kokiri Forest) turned the Deku Tree's mottled floors into big hard-edged blotches.
max_tiling_multiplier = 1.5

# Fluids (water, lava, other liquids; see docs/RULES.md "Fluids"). Every target's fluid
# treatments (listed or built in) stay within these: caustics are soft light over depth, never
# outlined cells.
[fluid]
max_wet_edges = 0.0
max_granulation = 0.0
max_value_contrast = 0.0
max_abstraction = 0.0
max_accent = 0.0
max_radius_scale = 0.5
# Rendered caustic water (every style and mood): the highlight lines keep at least this share of
# their lightness contrast over the depth; the depth's texel-level grit stays at most
# depth_max_grit (OKLab L, 1-texel high-pass std); at most max_outline_share of the depth texels
# come out darker than the source (as the mood dims it) by more than outline_drop (no cell
# outlines, measured against the depth's own median change); the body (the depth between the
# lines) moves toward the style's reference water lightness (as the mood dims it): at least
# body_min_lean of the configured pull, never past the reference, and without a pull (other
# liquids) within max_mean_l of the source; the highlight lines lose at most highlight_max_drop
# of their lightness (they stay bright while the body darkens). Engine-tinted gray water darkens
# by at most tint_safe_max_darkening (the engine tint supplies its final value).
highlight_min_contrast = 0.8
depth_max_grit = 0.012
outline_drop = 0.06
max_outline_share = 0.01
max_mean_l = 0.03
body_min_lean = 0.5
highlight_max_drop = 0.03
tint_safe_max_darkening = 0.1
# Lava is emissive (every style and mood, nocturne included): vein texels are never darkened by
# more than max_darkening, keep at least min_chroma_retention of their chroma, and their mean
# hue moves by at most max_hue_shift degrees (heat colors stay; no cool or pastel pull).
lava_max_darkening = 0.02
lava_min_chroma_retention = 0.9
lava_max_hue_shift = 8.0

# Low-resolution textures are painted at a resolution floor, not shown as a texel grid in a
# high-resolution game (the Deku Tree's 128x256 ring walls showed blocky pixel steps).
[resolution]
# A texture whose long side is below min_floor comes out enlarged by an integer factor (aspect
# kept) to a long side of at least min(min_floor, max_factor x its own), in every restyled
# category (a target may set a higher floor, e.g. for pre-rendered backgrounds).
min_floor = 1024
max_factor = 4
# No texel grid: the mean lightness step across the source's texel borders stays within this
# multiple of the mean step inside a source texel (a nearest-neighbor enlargement puts every step
# on a border: unbounded; a smooth interpolation of texel noise peaks between texel centers: ~2.6).
max_blockiness = 3.0
# The same painting, finer: area-averaged back to the source size, its 16x16 cell mean colors
# stay within this OKLab distance (p90) of the painting made at the source size.
max_coarse_delta_e = 0.04
