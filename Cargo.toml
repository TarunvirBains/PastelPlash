[package]
name = "pastelplash"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Restyle PNG and OTEX texture packs into a painterly watercolor and impressionist look on the GPU"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TarunvirBains/PastelPlash"
readme = "README.md"
keywords = ["texture-pack", "watercolor", "wgpu", "modding", "restyle"]
categories = ["command-line-utilities", "multimedia::images", "game-development"]
# The crate needs its sources, the built-in styles (compiled in) and the sample configs; test
# fixtures, golden hashes and dev scripts stay in the repository.
include = [
    "/src/**",
    "/styles/**",
    "/targets/**",
    "/packs/**",
    "/reference/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
png = "0.18.1"
pollster = "1.0.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "1.1.6"
wgpu = "30.0.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
# wgpu's naga, for the golden-hash test's HLSL check (keep the version equal to wgpu's).
naga = { version = "=30.0.1", features = ["wgsl-in", "hlsl-out"] }
proptest = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3.27.0"
