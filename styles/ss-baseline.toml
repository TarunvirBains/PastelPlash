# SS middle ground: the default watercolor's painted OoT look, nudged further toward Skyward
# Sword — stronger pulls to SS's hue families, SS-level chroma floors, a mild lift and softer
# contrast. Still recognizably OoT; for the full light take, see pastel.toml.
extends = "watercolor.toml"
name = "ss-baseline"

[palette]
l_curve = [[0, 0.27], [0.104, 0.31], [0.184, 0.36], [0.329, 0.46], [0.453, 0.56], [0.622, 0.7], [0.915, 0.92], [1, 0.97]]
l_floor = 0.27
harmonize = 0.1
neutral_tint = { hue = 105.0, chroma = 0.014, amount = 0.5 }

# Same groups as watercolor (entries merge in order), with stronger SS pulls.
[[palette.groups]]
hue_pull = 0.3

[[palette.groups]]
hue_pull = 0.35

[[palette.groups]]
hue_pull = 0.25

[[palette.groups]]
hue_pull = 0.45

[[palette.groups]]
hue_pull = 0.3

[[palette.groups]]
hue_pull = 0.5

[[palette.groups]]
hue_pull = 0.3

[value_contrast]
fine = 0.55
mid = 0.4
coarse = 0.12
