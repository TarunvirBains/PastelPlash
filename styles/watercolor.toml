# Default style: the source pack's rich color, painted. Hue families and chroma stay close to the
# source, with gentle nudges toward Skyward Sword's hues (yellow-green foliage, warm golden
# earth, turquoise water). Only crushed darks are lifted, into deep *colored* shadows; mid and
# light values stay near the source. The painted look comes from the technique: flattened
# washes that follow form, brushstrokes smeared along it, wet edges, granulation and paper.
#
# Sizes are in "reference texels": texels of a texture whose sqrt(width * height) equals
# scale.reference_size; they scale with resolution so every texture gets a comparable painterly
# scale.
name = "watercolor"

[scale]
reference_size = 1024
exponent = 1.0

[tiling]
threshold = 2.5

[delight]
strength = 1.0
radius = 0.06
min_gain = 0.6
max_gain = 2.0

[kuwahara]
radius = 8.0
strength = 1.0
sharpness = 8.0
hardness = 8.0
anisotropy = 1.0
zero_crossing = 0.58
tensor_sigma = 2.0
min_radius = 2.0
max_radius = 32.0

[palette]
enabled = true
strength = 1.0
lut_size = 65
# Near-identity above the darks: crushed blacks lift to deep shadows, highlights soften a touch.
l_curve = [[0, 0.19], [0.104, 0.215], [0.184, 0.26], [0.329, 0.365], [0.453, 0.475], [0.622, 0.64], [0.915, 0.9], [1, 0.97]]
l_floor = 0.19
l_ceiling = 0.97
floor_knee = 0.5
chroma_scale = 1.0
chroma_cap = 0.25       # above the source pack's 99th percentile: no global chroma reduction
chroma_lift = 0.3
dark_chroma = 0.05      # dull darks → deep colored shadows along their own hue (no mud)
dark_below = 0.45
neutral_c = 0.02
neutral_tint = { hue = 105.0, chroma = 0.012, amount = 0.3 }
# Lifted darks keep their source hue (dark brown → deep warm brown, dark green → deep green).
# Only neutral near-blacks get a tint: SS's measured shadow is warm umber (~70°), not blue.
shadow_tint = { below_input_l = 0.22, hue = 70.0, chroma = 0.04, amount = 0.6, colored = 0.0 }
dark_cool_bias = 0.0    # optional cool push on lifted darks; off keeps OoT's own shadow hues
# Targeted earth warmth: earth/olive/khaki hues lean toward SS's golden tan, weighted by chroma
# (gray stone stays gray). Tuned a little strong: Kokiri Forest's vertex light is greenish.
warmth = { strength = 0.45, band = [45.0, 100.0], feather = 10.0, hue = 68.0, chroma = 0.079, chroma_boost = 0.4, min_chroma = [0.02, 0.06], lift = 0.0 }
# Shared moonlight cast: off in the base look; the nocturne mood turns it on (see below).
cast = { strength = 0.0, hue = 275.0, tint = 0.04, exposure = 0.7, chroma = 0.85, dark_cap = 0.09, dark_min = 0.017, dark_chroma = 0.05, warm_band = [25.0, 110.0], black = [0.1, 0.25], black_chroma = 0.0 }
# Reference water tone for the water category (target `reference`): hue and chroma lean toward
# Skyward Sword's Ancient Cistern water and the N64 Deku Tree basement water (dark muted jade:
# measured h 136-143, C 0.04-0.06); lightness stays the source's, so every area keeps its depth.
water = { hue = 140.0, chroma = [0.035, 0.06], pull = 0.5 }
hue_feather = 10
pigments = [20.0, 58.0, 80.0, 100.0, 118.0, 135.0, 160.0, 195.0, 242.0, 280.0]
harmonize = 0.05
pigment_spread = 25.0
tint_safe_chroma = 0.03
vivid = 0.0
vivid_threshold = 0.15
vivid_max_chroma = 0.2
accent_fraction = 0.0    # off: specks read as noise, not shadow (impressionist keeps a few)
accent_radius = 16.0
accent_min_l = 0.3
accent_hue = 265.0
accent_chroma = 0.015
accent_softness = 0.6
accent_min_depth = 0.1
dark_greens = true
green_hue = [110.0, 175.0]
light_green_floor = 0.6

# Gentle SS hue nudges (hue_center = SS lit median hue); chroma stays at the source's level,
# with a floor (c_min ≈ 0.9 × SS lit median) so colored texels never go gray.
[[palette.groups]]
name = "red_pink"
hue_range = [345, 40]
hue_center = 11.5
hue_pull = 0.2
c_scale = 1.0
c_min = 0.032

[[palette.groups]]
name = "orange_brown_earth"     # → warm golden
hue_range = [40, 85]
hue_center = 68.0
hue_pull = 0.25
c_scale = 1.05
c_min = 0.07

[[palette.groups]]
name = "yellow_olive"
hue_range = [85, 115]
hue_center = 99.6
hue_pull = 0.15
c_scale = 1.0
c_min = 0.053

[[palette.groups]]
name = "green_foliage"          # → SS yellow-green
hue_range = [115, 170]
hue_center = 133.0
hue_pull = 0.3
c_scale = 1.05
c_min = 0.06

[[palette.groups]]
name = "cyan_teal"
hue_range = [170, 215]
hue_center = 198.3
hue_pull = 0.2
c_scale = 1.05
c_min = 0.047

[[palette.groups]]
name = "blue_sky_water"         # → SS turquoise-azure
hue_range = [215, 275]
hue_center = 230.0
hue_pull = 0.35
c_scale = 1.0
c_min = 0.066

[[palette.groups]]
name = "violet_magenta"
hue_range = [275, 345]
hue_center = 307.0
hue_pull = 0.2
c_scale = 1.0
c_min = 0.04

[temperature]
chroma = 0.006          # × target warm_cool (0 for actors)
warm_hue = 70.0
cool_hue = 250.0
sensitivity = 1.5

[strokes]
strength = 0.01
chroma = 0.1
width = 6.0
length = 18.0
smear = 0.35              # detail returns as streaks along the form

# Skyward Sword surfaces sit in a narrow lightness range: SS frames show ~0.4x the local L std
# of OoT Reloaded textures (7x7: 0.0078 vs 0.0193; 25x25: 0.0215 vs 0.0451). Compress fine
# light/dark detail strongly, large shapes barely; detail moves into color.
[value_contrast]
fine = 0.5
mid = 0.35
coarse = 0.1
chroma = 0.5
radius_fine = 3.0
radius_mid = 12.0
radius_coarse = 40.0
range = 0.12

# Busy, high-contrast textures (bark, Link's house walls: spread 0.09–0.19) are compressed toward
# Skyward Sword's measured bark spread (25x25 median L std of Faron Woods trunks: 0.020, range
# 0.004–0.033) at every scale incl. the grooves. Ground and grass (≤ 0.066) are below the trigger.
[contrast]
strength = 0.5             # 1.0 = all the way to the target; 0.5 keeps painted bark from going flat
target_spread = 0.03
trigger_spread = 0.08

[watercolor]
edge_darkening = 0.05
edge_relative = 0.5
edge_threshold = 0.04
edge_feather = 0.015
edge_width = 5.0
bleed = 0.4
bleed_radius = 6.0
bleed_range = 0.06
granulation = 0.025
granulation_scale = 4.0
granulation_valley = 0.5
paper_grain = 0.012
paper_tint = 0.1
paper_scale = 4.0
paper_highlight = 0.85
paper_color = [0.98, 0.965, 0.93]
floor_margin = 0.06
seed = 0

# Design-like abstraction for busy, photographic textures (same trigger as [contrast]): big
# shapes first, strokes that paint the simplified wash along the coarse structure, wet edges only
# on large regions, glare calmed, source chroma kept. Vines and ground (below the trigger) are
# unaffected.
[abstraction]
strength = 1.0
radius = 20.0
flow_scale = 3.0
stroke_scale = 1.8
edge_scale = 4.0
edge_soften = 0.5
highlight_calm = 0.8
highlight_radius = 12.0
chroma_retain = 0.9
min_frac = 0.03          # low-res textures on big surfaces still get big shapes

# Soft value grouping (notan) for the same busy, photographic textures: 2–4 value masses (found
# on an edge-aware smoothed lightness), each texel pulled softly toward its mass value and color
# (own hue family only). A bark photo becomes a clean dark mass with crisp pale lichen shapes;
# brushwork inside a mass varies hue and chroma more than value. World and background only.
[grouping]
strength = 0.7
max_masses = 4
explained = 0.85
min_gap = 0.08
min_share = 0.03
skip_explained = 0.96
radius = 0.008
range = 0.06
softness = 0.5
color = 0.4
color_family = 0.08
salient = [0.16, 0.26]
stroke_value = 0.5

# Paint marks: fine color variation becomes soft dabs of this radius (reference texels).
# Tiling, speckled textures (photographic ground grit) get bigger dabs: they repeat many times, so
# their marks shrink in world space. Skyward Sword ground dabs are ~1% of screen width; a 512 px
# Kokiri ground tile spans ~20% of the screen near the camera, so a dab is ~5% of the tile
# (~25 texels across, radius ~12) vs. the default radius 4 at that size: multiplier 3.
# Shape-based art (vines, leaves: speckle ratio ~0.34) is not affected.
[marks]
size = 8.0
tiling_multiplier = 3.0
speckle = [0.45, 0.6]
# Dark specks up to ~2.5 reference texels (dust in a cobweb) are cleaned before painting.
speck_radius = 2.5
speck_depth = 0.06
# Thin handles, poles and rails keep their value (not smoothed or compressed into the wall).
thin_protect = 1.0

# Nocturne mood (dark, haunting areas; assigned by the pack map): a Whistler/Monet nocturne
# overlay on this style. Only these keys change; everything else (abstraction, marks, contrast,
# strokes, hue-true darks, identity) is inherited. Moonlight is one shared cast: every color
# shifts the same way — darker (exposure), proportionally less saturated, nudged toward the cast
# hue — so hue differences survive (moss stays greener than wood). The pack map may give an area
# its own cast (midnight blue, indigo, midnight purple) and strength. Near-neutral darks take a
# muted midnight, never ink. At any mood strength (`hold`): earth warmth fully off, and the
# night's tone curve (no murk lift beyond its low floor: near-blacks stay the darkest part).
[moods.nocturne]
hold = ["palette.warmth.strength", "palette.l_curve", "palette.l_floor", "watercolor.floor_margin"]

[moods.nocturne.palette]
l_curve = [[0, 0.155], [0.104, 0.17], [0.184, 0.21], [0.329, 0.315], [0.453, 0.43], [0.622, 0.59], [0.915, 0.87], [1, 0.95]]
l_floor = 0.155
dark_below = 0.4
warmth = { strength = 0.0 }
cast = { strength = 1.0 }
# The cast (applied per texel after the palette LUT) handles the darks: the base's
# colored-shadow floor, umber shadow tint and neutral tint fade out (hues must not be blended
# numerically: halfway between olive and indigo is teal); near-neutral darks take a muted
# midnight, colored darks keep their own hue and the cast's dark_chroma floor.
shadow_tint = { amount = 0.0 }
neutral_tint = { amount = 0.0 }
dark_chroma = 0.0
chroma_lift = 0.1

# No warm/cool from baked shading: the night is uniformly cool.
[moods.nocturne.temperature]
chroma = 0.0

# Atmosphere: let the cast's desaturation through on busy textures too.
[moods.nocturne.abstraction]
chroma_retain = 0.6

# The dimmer night brings mids down toward the floor: finish darkening (wet edges, granulation)
# may undercut the floor only a little.
[moods.nocturne.watercolor]
floor_margin = 0.015

# Moonlit scenes read by value: less internal compression than the day.
[moods.nocturne.value_contrast]
fine = 0.35
mid = 0.25
