# Pastel (optional): a light, dreamy take. Skyward Sword's lightness, hue and chroma targets
# (reference/ss-lit.toml, the "lit" subset), pushed further toward pure pastel: every hue lifted
# and softer in contrast, but never grayer — chroma stays at SS's levels. This moves furthest
# from the source's look; the default `watercolor` keeps OoT's own colors.
#
# Sizes are in "reference texels": texels of a texture whose sqrt(width * height) equals
# scale.reference_size; they scale with resolution so every texture gets a comparable painterly
# scale.
name = "pastel"

[scale]
reference_size = 1024
exponent = 1.0

[tiling]
threshold = 2.5

[delight]
strength = 1.0
radius = 0.06
min_gain = 0.6
max_gain = 2.0

[kuwahara]
radius = 8.0
strength = 1.0
sharpness = 8.0
hardness = 8.0
anisotropy = 1.0
zero_crossing = 0.58
tensor_sigma = 2.0
min_radius = 2.0
max_radius = 32.0

[palette]
enabled = true
strength = 1.35         # 1 = SS; beyond lightens (softer contrast), never grays
lut_size = 65
l_curve = [[0, 0.38], [0.104, 0.407], [0.184, 0.438], [0.329, 0.565], [0.453, 0.72], [0.622, 0.87], [0.915, 0.955], [1, 0.975]]
l_floor = 0.55
l_ceiling = 0.92        # not too close to white: sRGB has little chroma there (blues bleach)
chroma_scale = 1.0
chroma_cap = 0.165      # SS 99th-percentile chroma
chroma_lift = 0.3       # lifted colors gain a little chroma so they stay clean, not chalky
dark_chroma = 0.05
dark_below = 0.45
neutral_c = 0.02
neutral_tint = { hue = 105.0, chroma = 0.014, amount = 0.5 }   # SS neutrals: faint warm cream
# SS measures warm-umber shadows; subtle and world-only (target shadow_tint).
shadow_tint = { below_input_l = 0.25, hue = 72.0, chroma = 0.03, amount = 0.4 }
hue_feather = 10
pigments = [20.0, 58.0, 80.0, 100.0, 118.0, 135.0, 160.0, 195.0, 242.0, 280.0]
harmonize = 0.1
pigment_spread = 25.0
tint_safe_chroma = 0.03
vivid = 0.4
vivid_threshold = 0.15
vivid_max_chroma = 0.17
accent_fraction = 0.01
accent_radius = 16.0
accent_min_l = 0.62
accent_hue = 262.0
accent_chroma = 0.04
accent_softness = 0.6
accent_min_depth = 0.1
dark_greens = true
green_hue = [110.0, 175.0]
light_green_floor = 0.74

# Hue groups: hue_shift/hue_center from SS vs. OoT Reloaded, c_cap = SS lit chroma p90,
# c_min ≈ 0.9 × SS lit median chroma ("pastel is not gray"), pastel floors (no dark greens).
[[palette.groups]]
name = "red_pink"
hue_range = [345, 40]
hue_shift = -8.0
hue_center = 11.5
hue_pull = 0.2
l_offset = -0.04
l_floor = 0.6
c_scale = 0.7
c_cap = 0.104
c_min = 0.032

