# Impressionist variant: same SS-derived pastel palette, bolder directional brushstrokes, more
# cool accent darks, stronger warm/cool temperature on world textures and a little more vivid
# color. Still light pastel overall.
name = "impressionist"

[scale]
reference_size = 1024
exponent = 1.0

[tiling]
threshold = 2.5

[delight]
strength = 1.0
radius = 0.06
min_gain = 0.6
max_gain = 2.0

[kuwahara]
radius = 10.0
strength = 1.0
sharpness = 8.0
hardness = 8.0
anisotropy = 1.0
zero_crossing = 0.58
tensor_sigma = 2.0
min_radius = 2.0
max_radius = 32.0

[palette]
enabled = true
strength = 1.35
lut_size = 33
l_curve = [[0, 0.38], [0.104, 0.407], [0.184, 0.438], [0.329, 0.565], [0.453, 0.72], [0.622, 0.87], [0.915, 0.955], [1, 0.975]]
l_floor = 0.55
l_ceiling = 0.975
chroma_scale = 1.0
chroma_cap = 0.165
neutral_c = 0.02
neutral_tint = { hue = 98.0, chroma = 0.014, amount = 0.5 }
# SS measures warm-umber shadows; kept subtle and world-only (target shadow_tint).
shadow_tint = { below_input_l = 0.25, hue = 72.0, chroma = 0.03, amount = 0.4 }
hue_feather = 10
# Limited pigment set measured from public-domain watercolors (pastel-lifted hues).
pigments = [20.0, 58.0, 80.0, 100.0, 118.0, 135.0, 160.0, 195.0, 242.0, 280.0]
harmonize = 0.3
pigment_spread = 25.0
tint_safe_chroma = 0.03
# Occasional vivid color: very saturated sources keep a little more chroma (never more L).
vivid = 0.6
vivid_threshold = 0.15
vivid_max_chroma = 0.18
# Impressionist accent darks: the most crevice-like texels become cool violet, never black.
accent_fraction = 0.04
accent_radius = 16.0
accent_min_l = 0.52
accent_hue = 262.0
accent_chroma = 0.07
accent_softness = 0.6
accent_min_depth = 0.08

