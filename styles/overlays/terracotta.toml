# Terracotta palette layer (not a style on its own): Skyward Sword's Faron Woods earth, a warm
# rose-sienna on mid-value, grain-free earth browns (dirt, clods, rock), per texture. Bark,
# planks, wood floors, light sand, olive moss and grass keep their color; so do actors,
# pre-rendered backgrounds, fluids, skies and UI (world textures only). See config::Terracotta.
[terracotta]
strength = 0.8
hue = 45.0
band = [30.0, 95.0]
feather = 10.0
min_chroma = 0.03
gather = 0.5
chroma_boost = 0.2
min_earth_share = 0.6
value = [0.3, 0.62]
max_mean_hue = 82.0
max_grain = 0.5

# Terracotta is a daylight look: dark, moonlit areas keep their own earth (at any mood strength).
[moods.nocturne]
hold = ["palette.warmth.strength", "palette.l_curve", "palette.l_floor", "watercolor.floor_margin", "marks.tiling_multiplier", "terracotta.strength"]

[moods.nocturne.terracotta]
strength = 0.0
