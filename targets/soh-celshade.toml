# Target profile: Ship of Harkinian cel-shading fork (9.2.3-celshade0.11). See PLAN.md "Target notes".
#
# Only actors are relit by the toon shader (texel.rgb *= mix(shadow, lit, ramp); lit can exceed 1),
# so actors get full de-lighting, a lightness ceiling, and no baked temperature or shadow tint:
# the shader decides lit/shadow at runtime. World geometry keeps vanilla vertex shading.
name = "soh-celshade"

[categories.actor]
delight = 0.5
lightness_ceiling = 0.88
warm_cool = 0.0
shadow_tint = 0.0
accent = 0.5

[categories.world]
delight = 0.35
warm_cool = 1.0
shadow_tint = 1.0
accent = 1.0

# Pre-rendered backdrops: their painted lighting is the scene's lighting, so no de-lighting.
[categories.background]
delight = 0.0
warm_cool = 0.5
shadow_tint = 1.0
accent = 1.0

[categories.skybox]
delight = 0.0
warm_cool = 0.5
shadow_tint = 0.0
accent = 0.0
stroke_scale = 2.0
