# Target profile: Ship of Harkinian cel-shading fork (9.2.3-celshade0.11). See PLAN.md "Target notes".
#
# Only actors are relit by the toon shader (texel.rgb *= mix(shadow, lit, ramp); lit can exceed 1),
# so actors keep their own (mid-light, clearly colored) values: little pastel lift, light
# de-lighting, a lightness ceiling with headroom for the lit multiplier, and no baked temperature
# or shadow tint (the shader decides lit/shadow at runtime). World geometry keeps vanilla vertex
# shading.
name = "soh-celshade"

# Output resolution floor (the game is played at up to 4K): textures whose long side is below 1024
# are written larger (at most 4x, a power of two), restyled at 2x the output size and averaged
# down, so small textures no longer show their texel grid. SoH samples an enlarged texture
# correctly when the OTEX header's HD scale factors grow with it (the .o2r adapter does that;
# verified in-game). floor = 0 turns it off; lower it to save disk space and video memory.
[resolution]
floor = 1024
max_factor = 4
power_of_two = true
internal = 2

[categories.actor]
strokes = 2.5            # solid things read painted: brushwork comparable to the world's (faces lighter: pack map)
delight = 0.2
lightness_ceiling = 0.8
ceiling_knee = 0.15     # only the top is compressed: skin and hair keep their lightness
floor_scale = 0.25      # a quarter of the palette's lift
hue = 0.3               # keep actors' own skin, hair and leather hues
warm_cool = 0.0
shadow_tint = 0.0
accent = 0.0            # no baked cool accent darks either: they read as blue flecks on metal and gems
paper = 0.3
value_contrast = 0.4    # the cel shader supplies actors' light and shadow; keep their painted form
warmth = 0.3            # a little earth warmth (leather, hair); skin keeps its own hue
grouping = 0.0          # never value-grouped: the cel shader bands actors already
tint_safe_gray = 0.87     # engine-tinted grays (tunics, gems): raised, the tint darkens them
tint_safe_max_gain = 1.5  # ...by at most 1.5x their own median: dark and black tinted textures keep their value
tint_safe_strokes = 0.09  # brightness-only strokes along the cloth's folds
dark_chroma = 0.0       # no umber floor for dark near-neutrals: steel stays steel, the cel shader shades
cast = 0.0              # no baked moonlight either: the renderer lights actors in every area

[categories.world]
delight = 0.35
warm_cool = 1.0
shadow_tint = 1.0
accent = 1.0

# Pre-rendered backdrops (Link's house, the shops, the market): finished paintings with the
# designers' lighting, so the gentlest treatment. No de-lighting, no value grouping, no
# abstraction, no accents or warm/cool split (one color family); the palette's hue pulls, warmth
# and chroma floors held back (brown stays brown); light brushwork; the painted texture recedes a
# little (softer local contrast) while the room's light and dark masses stay.
[categories.background]
delight = 0.0
warm_cool = 0.0
shadow_tint = 1.0
accent = 0.0
abstraction = 0.0      # keep every painted object (tool handles, bowls)
grouping = 0.0
value_contrast = 0.9   # recede: local contrast softened, the big masses kept
hue = 0.3
warmth = 0.3
chroma_floor = 0.3
dark_chroma = 0.35     # the room's shadows: lifted and colored, not re-saturated
strokes = 0.5          # light brushwork
radius_scale = 0.8
# The room's lighting and mood are painted in: keep the murk lift (crushed darks become readable
# colored shadow), then bring mids and lights down with a monotone curve so the room's mean
# lightness (its exposure) matches the source.
exposure = { preserve_mean = true, protect = [0.15, 0.75] }
# Pre-rendered rooms fill the screen: about 3840 wide (Link's house 1280x960 -> 3840x2880,
# verified in-game), any integer factor up to 4.
resolution = { floor = 3840, max_factor = 4, power_of_two = false, internal = 2 }

[categories.skybox]
dark_chroma = 0.0       # no warm umber floor: a night sky's black gaps and faint blue darks stay neutral and blue, never brown
floor_scale = 0.0       # no lift: a night sky keeps its night (the lift took it from L 0.12 to 0.29)
hue = 0.2               # the sky keeps its own blue (the SS pull turned royal blue cyan); a light nudge only
delight = 0.0
warm_cool = 0.5
shadow_tint = 0.0
accent = 0.0
stroke_scale = 2.0
value_contrast = 0.0
warmth = 0.0
