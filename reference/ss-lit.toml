# Skyward Sword HD reference palette: per hue group statistics of the "lit" subset (each
# screenshot's pixels at or above its own 40th-percentile lightness) of 27 official 2021 press
# screenshots, in OKLCH. Measured by the palette study (see PLAN.md, Palette); used by
# `pastelplash palette-report` and the "pastel is not gray" rule as the chroma reference.
name = "ss-lit"

# group: OKLCH hue range, median L, median C, 90th-percentile C, median hue.
[[groups]]
name = "red_pink"
hue_range = [345, 40]
l = 0.537
c = 0.036
c_p90 = 0.104
h = 11.5

